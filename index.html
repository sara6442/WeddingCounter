<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>عدّاد المعازيم</title>
<link href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdf6;--ink:#2b2b2b;--dot:#ddd8c8;--card:#fff;--ln:#444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#23221f;--ink:#eee;--dot:#3a3935;--card:#2e2d29;--ln:#ccc}}
:root[data-theme="dark"]{--bg:#23221f;--ink:#eee;--dot:#3a3935;--card:#2e2d29;--ln:#ccc}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{position:relative;background:var(--bg);color:var(--ink);font-family:'Marhey','Segoe UI',Tahoma,sans-serif;overflow:hidden}
#bd{position:absolute;inset:0;direction:ltr;touch-action:none;cursor:grab;background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:26px 26px}
#cv{position:absolute;left:0;top:0;transform-origin:0 0;color:var(--ln)}
.t{position:absolute;border:2px dashed var(--ln);border-radius:16px 8px 18px 9px/9px 17px 8px 16px}
.th{position:relative;z-index:2;height:34px;display:flex;align-items:center;gap:4px;padding:0 10px;cursor:move;font-weight:600;direction:rtl;user-select:none}.th span{flex:1}
button{font:inherit;cursor:pointer;color:inherit}
.th button,.p button{background:none;border:0;padding:0 2px;font-size:13px}
.p{position:absolute;width:130px;height:56px;background:#fff;color:#222;border:3px solid;border-radius:12px 6px 14px 7px/7px 13px 6px 12px;padding:6px 10px 6px 24px;font-size:14px;display:flex;align-items:center;cursor:pointer}
.p b{font-weight:600;line-height:1.2;direction:rtl;text-align:right;width:100%;overflow:hidden;max-height:42px}
.p small{position:absolute;right:4px;bottom:1px;font-size:10px}
.m{border-color:#9cc3ee}.f{border-color:#f2a9c9}
.dead{background:#e2e2e2;color:#888;border-style:dashed}.dead b{opacity:.7}
.pr{position:absolute;left:5px;top:5px;width:13px;height:13px;border-radius:50%;border:2px dashed #aaa}
.pr1{background:#e5484d;border:2px solid #e5484d}.pr2{background:#f5c518;border:2px solid #f5c518}.pr3{background:#3cb371;border:2px solid #3cb371}
.p button{position:absolute;bottom:1px;left:3px}.p button+button{left:22px;opacity:.45}.p button.on{opacity:1}.p button+button+button{left:40px}
.big{position:absolute;left:50%;top:calc(50% + 17px);transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;border:3px dashed var(--ln);background:var(--card);font-size:40px;color:var(--ink)}
.cat-big{position:absolute;left:50%;top:calc(50% + 10px);transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:3px dashed var(--ln);background:var(--card);font-size:26px;color:var(--ink);line-height:1}
.tb.on{background:#ffd95a;color:#222}.ms .p button,.ms .pl{display:none!important}.p.ms1{outline:3px solid #ffb300;outline-offset:2px}.no{opacity:.5}.no b{text-decoration:line-through}
.bg{position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;font-style:normal;text-align:center;line-height:20px;font-size:12px;color:#fff;z-index:3}.bg.y{background:#3cb371}.bg.n{background:#e5484d}
#mb{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--card);border:2px solid var(--ln);border-radius:12px;padding:6px 10px;z-index:40;max-width:94vw}
#ts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:2px solid var(--ln);border-radius:10px;padding:6px 14px;display:none;z-index:60}
.pl{position:absolute;width:20px;height:20px;line-height:16px;text-align:center;background:#fff;color:#222;border:2px solid #555;border-radius:50%;font-size:15px;display:none;z-index:5;text-decoration:none}
.p:hover .pl,.p.sel .pl{display:block}.p:hover,.p.sel{z-index:9}
.pl.l{left:-22px;top:15px}.pl.r{right:-22px;top:15px}
/* دائرة إضافة صديق أسفل الفئة */
.plu{position:absolute;left:50%;transform:translateX(-50%);width:26px;height:26px;line-height:22px;text-align:center;background:var(--card);color:var(--ink);border:2px dashed var(--ln);border-radius:50%;font-size:16px;cursor:pointer;z-index:4}
.plu:hover{background:#ffd95a;color:#222}
/* مستطيل الفئة */
.cat{position:absolute;border:2px dashed var(--ln);border-radius:10px 6px 12px 7px;opacity:.85;pointer-events:none}
.cat .cat-t{position:absolute;right:8px;top:-11px;background:var(--card);padding:0 6px;font-size:11px;font-weight:600;color:var(--ink);border:1px solid var(--ln);border-radius:6px;pointer-events:auto;white-space:nowrap}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}#top h1{margin:0 0 0 auto;font-size:22px;order:-1}
.tb{background:var(--card);border:2px solid var(--ln);border-radius:10px 5px 11px 6px;padding:3px 10px}
#wbName{background:var(--card);border:2px solid var(--ln);border-radius:10px 5px 11px 6px;padding:3px 12px;font-weight:600;font-size:14px;min-width:120px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
#cnt{position:fixed;left:8px;top:calc(54px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;direction:ltr;background:var(--card);border:2px solid var(--ln);border-radius:12px 6px 14px 7px;padding:8px;font-size:13px;width:130px;pointer-events:none;z-index:15}
#cnt .cr{display:flex;align-items:flex-start;justify-content:flex-end;gap:5px;border-bottom:1px dashed var(--ln);padding-bottom:8px}
#cnt .tx{display:flex;flex-direction:column;align-items:flex-end;gap:3px;direction:rtl;line-height:1.3}#cnt .tot{border:2px solid var(--ln);border-radius:8px 4px 9px 5px;padding:1px 8px}#cnt .bl{color:#4a90d9}#cnt .pk{color:#e0568f}
#cnt em{display:flex;flex-direction:column;gap:4px;margin-top:3px}#cnt em i{width:14px;height:14px;border-radius:50%;display:block}
#ov{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:50}
#dl{background:var(--card);color:var(--ink);border:2px solid var(--ln);border-radius:14px 7px 16px 8px;padding:14px;width:min(420px,92vw);max-height:90vh;overflow:auto}
#dl h3{margin:0 0 6px}#dl label{display:block;margin:8px 0 3px;font-size:13px}
#dl input[type=text],#dl select,#dl textarea{width:100%;font:inherit;padding:6px;background:var(--bg);color:var(--ink);border:2px solid var(--ln);border-radius:8px}#dl textarea{height:140px}
.ch{display:flex;gap:5px;flex-wrap:wrap}.ch button,.bt button{background:var(--bg);border:2px solid var(--ln);border-radius:8px;padding:3px 10px}.ch .on,#ok{background:#ffd95a!important;color:#222}
.bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.rd{color:#c33}
.pc{position:absolute;right:4px;top:1px;font-size:9px;opacity:.7;background:#fff;color:#222;padding:0 3px;border-radius:4px}
.tcnt{position:absolute;left:50%;top:4px;transform:translateX(-50%);background:var(--card);border:2px solid var(--ln);border-radius:8px 4px 9px 5px;padding:1px 10px;font-size:12px;font-weight:600;direction:rtl;z-index:6;cursor:help;pointer-events:auto}
.tcnt .pop{display:none;position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;background:var(--card);border:2px solid var(--ln);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:400;line-height:1.7;min-width:180px;text-align:right;white-space:nowrap;box-shadow:0 2px 10px #0003;z-index:10}
.tcnt:hover .pop{display:block}
.tcnt .pop b{font-weight:600}
.tcnt .m{color:#4a90d9}.tcnt .f{color:#e0568f}.tcnt .dl{color:#888}
#wb{position:fixed;left:8px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:var(--card);border:2px solid var(--ln);border-radius:12px;padding:8px;font-size:12px;width:190px;z-index:20}
#wb .lbl{font-weight:600;font-size:13px;color:var(--ink);opacity:.85;margin-bottom:2px;text-align:center}
#wbList{display:flex;flex-direction:column;gap:3px;max-height:170px;overflow:auto;border:1px dashed var(--ln);border-radius:6px;padding:4px}
#wbList button{width:100%;text-align:right;background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:3px 6px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wbList button.cur{background:#ffd95a;color:#222;font-weight:600}
#wbList button:hover{background:#ffd95a;color:#222}
#wb .row{display:flex;flex-direction:column;gap:4px}
#wb .row button{width:100%;background:var(--bg);border:2px solid var(--ln);border-radius:6px;padding:5px 8px;font-size:12px;text-align:center}
#wb .row button:hover{background:#ffd95a;color:#222}
/* قائمة الروابط في نافذة الحذف */
.lnk{display:flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:6px;padding:4px 6px;margin:4px 0;font-size:12px}
.lnk b{flex:1}
.lnk button{background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:2px 6px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="wbf"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>
<div id="bd"><div id="cv"><svg id="lk" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" fill="none" stroke="currentColor" stroke-width="2"></svg><div id="tr"></div></div></div>
<div id="top">
  <h1>✏️ عدّاد المعازيم</h1>
  <div id="wbName" title="اسم المناسبة (اضغط للتعديل)">—</div>
  <button class="tb" id="nf">🌳 شجرة عائلة</button>
  <button class="tb" id="nr">🧑‍🤝‍🧑 شجرة أصدقاء</button>
  <button class="tb" id="bk">💾 نسخ احتياطي</button>
  <button class="tb" id="ms">☑ تحديد</button>
  <button class="tb" id="un">↶ تراجع</button>
  <button class="tb" id="re">↷ إعادة</button>
  <button class="tb" id="zi">＋</button>
  <button class="tb" id="zo">－</button>
  <button class="tb" id="zr">⌂</button>
</div>
<div id="cnt"></div><div id="ts"></div><div id="mb"></div>

<div id="wb">
  <div class="lbl">المناسبات</div>
  <div id="wbList"></div>
  <div class="row">
    <button id="wbNew">＋ جديدة</button>
    <button id="wbDup">⧉ نسخ</button>
    <button id="wbSave">💾 حفظ</button>
    <button id="wbDel">🗑 حذف</button>
    <button id="wbLink">🔗 نسخ الرابط</button>
  </div>
</div>

<div id="ov"><div id="dl"></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s),W=130,H=56,G=26,V=86;
let MSON=false,S=null,TW={},KO={},POS={},OX={},TH={},memo,sel=null,drag=null;
let UNDO=[],REDO=[],UNDO_LOCK=false;

const uid=()=>Math.random().toString(36).slice(2,9);
const LS_KEY='mz2',LS_OLD='mz',LS_BAK='mz_backup';

function migrate(){
  let raw=null;try{raw=JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){}
  if(raw&&raw.boards&&Array.isArray(raw.boards)&&raw.boards.length){raw.boards.forEach(b=>{(b.trees||[]).forEach(migrateTree)});return raw}
  let old=null;try{old=JSON.parse(localStorage.getItem(LS_OLD)||'null')}catch(e){}
  if(old)try{localStorage.setItem(LS_BAK,JSON.stringify(old))}catch(e){}
  const trees=(old&&old.trees)||[];
  trees.forEach(migrateTree);
  const b={id:uid(),name:'',trees:trees,v:(old&&old.v)||{x:40,y:70,k:1},savedAt:Date.now()};
  return {boards:[b],current:b.id};
}
function migrateTree(t){
  if(!t||!t.persons)return;
  Object.values(t.persons).forEach(p=>{
    if(p.br&&!p.links){p.links=[{br:p.br,bp:p.bp,rel:p.rel||'p'}]}
    delete p.br;delete p.bp;delete p.rel;
    if(!Array.isArray(p.links))p.links=[];
  });
  if(t.ty=='fr'){
    // ترحيل شجرة الأصدقاء إلى فئات
    if(!t.cats)t.cats=[];
    if(!t.meta)t.meta={};
    if(!t.meta.migrated){
      // حوّل كل الأصدقاء إلى فئة "أصدقاء" إن لم يكن لديهم فئة
      Object.values(t.persons).forEach(p=>{if(!p.cat)p.cat='أصدقاء'});
      t.meta.migrated=1;
    }
  }
}
S=migrate();

const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}};
const curBoard=()=>S.boards.find(b=>b.id==S.current)||S.boards[0];
const boardTrees=()=>{const b=curBoard();return b?(b.trees||(b.trees=[])):[]};
const boardView=()=>{const b=curBoard();return b?(b.v||(b.v={x:40,y:70,k:1})):{x:40,y:70,k:1}};

function snap(){if(UNDO_LOCK)return;UNDO.push(JSON.stringify(S));if(UNDO.length>60)UNDO.shift();REDO=[]}
function undo(){if(!UNDO.length)return;REDO.push(JSON.stringify(S));const p=UNDO.pop();UNDO_LOCK=true;S=JSON.parse(p);try{localStorage.setItem(LS_KEY,p)}catch(e){}tf();render();UNDO_LOCK=false}
function redo(){if(!REDO.length)return;UNDO.push(JSON.stringify(S));const p=REDO.pop();UNDO_LOCK=true;S=JSON.parse(p);try{localStorage.setItem(LS_KEY,p)}catch(e){}tf();render();UNDO_LOCK=false}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PU=(t,id)=>t.unions.find(u=>u.kids.includes(id));
const root=t=>{let x=Object.keys(t.persons)[0];for(let i=0;i<99;i++){const j=t.unions.find(u=>u.s==x),q=PU(t,x);if(j)x=j.p;else if(q)x=q.p;else break}return x};
const tp=(t,x)=>{for(let i=0;i<99;i++){const q=PU(t,x);if(!q)break;x=q.p}return x};
const MS=new Set();
const gc=t=>{if(!t||t.ty=='fr')return;t.unions=t.unions.filter(u=>{const p=t.persons[u.p];if(p&&p.ph&&!u.kids.length){delete t.persons[u.p];return false}return true})};
const ch=()=>{boardTrees().forEach(gc);save();render()};
const CH=()=>{snap();ch()};
const cl=(A,B)=>A.some(a=>B.some(b=>a.r==b.r&&Math.abs(a.x-b.x)<W+10));
const sh=(A,x,r)=>A.map(a=>({i:a.i,x:a.x+x,r:a.r+r}));
function anc(t,sid,sd){const Q=PU(t,sid);if(!Q)return[];KO[Q.id]={s:sid,d:sd};
 const b=lay(t,tp(t,Q.p)),g=b.it.find(a=>a.i==sid);return g?sh(b.it.filter(a=>a.i!=sid),-g.x,-g.r):[]}
function lay(t,id){if(memo[id])return memo[id];const B=memo[id]={it:[{i:id,x:0,r:0}]};
 const us=t.unions.filter(u=>u.p==id),sp=us.filter(u=>u.s);let it,d=W+G;
 for(;d<W+G+1400;d+=20){it=[{i:id,x:0,r:0}];sp.forEach(u=>{const x=u.side=='L'?-d:d;it.push({i:u.s,x,r:0},...sh(anc(t,u.s,u.side),x,0))});
  if(!it.some((a,i)=>it.some((b,j)=>j>i&&a.r==b.r&&Math.abs(a.x-b.x)<W+10)))break}
 const w=k=>{const q=t.unions.filter(x=>x.p==k&&x.s&&PU(t,x.s));return q.some(x=>x.side=='L')?-1:q.some(x=>x.side=='R')?1:0};
 [...sp,...us.filter(u=>!u.s)].forEach(u=>{let ks=u.kids.slice().sort((a,b)=>w(a)-w(b));const e=KO[u.id];if(e){ks=ks.filter(k=>k!=e.s);e.d=='R'?ks.unshift(e.s):ks.push(e.s)}
  if(!ks.length)return;let acc=[],xs=[];
  ks.forEach(k=>{const b=sh(lay(t,k).it,0,1);let x=0;if(acc.length){x=-1e9;acc.forEach(a=>b.forEach(c=>{if(a.r==c.r)x=Math.max(x,a.x-c.x+W+G)}))}xs.push(x);acc=acc.concat(sh(b,x,0))});
  const cm=u.s?(u.side=='L'?-d/2:d/2):0,mid=(xs[0]+xs[xs.length-1])/2;let ok=0;
  for(let k=0;k<400&&!ok;k++){const z=sh(acc,cm-mid+(k%2?-1:1)*Math.ceil(k/2)*10,0);if(!cl(z,it)){it=it.concat(z);ok=1}}
  if(!ok)it=it.concat(sh(acc,cm-mid+4000,0))});
 B.it=it;return B}
const hsd=(t,id,s)=>t.unions.some(u=>u.p==id&&u.s&&u.side==s);
function linksOf(p){return Array.isArray(p.links)?p.links:[]}
function ph(t,id,x,y,pl){const p=t.persons[id];if(!p||p.ph)return'';
 const ln=linksOf(p),hasFr=ln.some(l=>{const c=boardTrees().find(z=>z.id==l.br);return c&&c.ty=='fr'});
 const cat=p.cat?`<i class="pc">${esc(p.cat)}</i>`:'';
 const linkIcon=ln.length?`<button data-a="br" class="${ln.length?'on':''}" title="إضافة رابط لشجرة أخرى">🌿${ln.length>1?ln.length:''}</button>`:'<button data-a="br" class="" title="ربط بشجرة أخرى">🌿</button>';
 const eyeBtn=hasFr?`<button data-a="eye" title="إظهار/إخفاء شجرة الأصدقاء المرتبطة">👁</button>`:'';
 return`<div class="p ${p.g} ${p.d?'dead':''} ${sel==id?'sel':''} ${MS.has(id)?'ms1':''} ${p.st=='n'?'no':''}" data-i="${id}" style="left:${x-W/2}px;top:${y}px">${p.d?'':`<i class="pr pr${p.pr}" data-a="pr" title="الأولوية"></i>`}${p.st?`<em class="bg ${p.st}">${p.st=='y'?'✔':'✖'}</em>`:''}${cat}<b>${esc(p.n)}</b><button data-a="ed">✎</button>${linkIcon}${eyeBtn}<button data-a="ai" title="إضافة أفراد بالكتابة">✨</button>${[...pl].map(k=>`<u class="pl ${k}" data-a="${k}">+</u>`).join('')}</div>`}
function tcnt(t){let m=0,f=0,dm=0,df=0,noM=0,noF=0;
 Object.values(t.persons).forEach(p=>{if(p.ph)return;if(p.d){p.g=='f'?df++:dm++;return}
  p.g=='f'?f++:m++;
  if(p.st=='n'){p.g=='f'?noF++:noM++}});
 const mAlive=m-noM,fAlive=f-noF;
 return`<div class="tcnt">عداد<span class="pop"><b>العدد الكلي</b><br><span class="m">ذكور: ${m}</span> · <span class="f">إناث: ${f}</span><br><b>بعد خصم الاعتذار</b><br><span class="m">ذكور: ${mAlive}</span> · <span class="f">إناث: ${fAlive}</span><br><span class="dl">معتذر: ${noM+noF}</span>${dm+df?`<br><span class="dl">متوفى: ${dm+df}</span>`:''}</span></div>`}

/* ============ layout لشجرة الأصدقاء بالفئات ============ */
function layoutFr(t){
  const cats=(t.cats&&t.cats.length?t.cats:Array.from(new Set(Object.values(t.persons).map(p=>p.cat||'أصدقاء'))));
  t.cats=cats.slice();
  const byCat={};cats.forEach(c=>byCat[c]=[]);
  Object.values(t.persons).forEach(p=>{const c=p.cat||'أصدقاء';if(!byCat[c]){byCat[c]=[];t.cats.push(c)}(byCat[c]=byCat[c]||[]).push(p.id)});
  // لكل فئة: صفوف
  const catMeta={};
  let y=0;
  const pad=14,headPad=22,rowH=H+14,gap=18;
  cats.forEach(c=>{
    const ids=byCat[c]||[];
    // صفوف: نضع الفرد الأول في صف، ثم أي فرد له of في نفس صف "of" (على يساره أو يمينه)
    const rows=[],used=new Set();
    ids.forEach(id=>{
      if(used.has(id))return;
      const p=t.persons[id];
      if(p.of&&byCat[c].includes(p.of)&&!used.has(p.of)){/* سيُضاف مع of */}
      const row=[id];used.add(id);
      // أضف التوابع (L/R) له
      (p.L||[]).forEach(r=>{if(!used.has(r)&&byCat[c].includes(r)){row.push(r);used.add(r)}});
      (p.R||[]).forEach(r=>{if(!used.has(r)&&byCat[c].includes(r)){row.push(r);used.add(r)}});
      rows.push(row);
    });
    // احسب عرض الفئة = أوسع صف
    const cols=Math.max(1,...rows.map(r=>r.length));
    const cw=cols*(W+14)+pad*2;

  const ot=boardTrees().filter(x=>x!=t&&Object.keys(x.persons).length);
  const o=[['new','＋ شجرة جديدة']].concat(ot.map(x=>[x.id,x.name]));
  const tg=v=>v.sel=='new'?{ty:v.ty}:ot.find(x=>x.id==v.sel);
  dlg('🌿 إضافة رابط لـ «'+esc(p.n)+'»',
    [{k:'sel',l:'اربط بـ',t:'sel',o,v:'new'}].concat(
      ot.map(x=>({k:'pp'+x.id,l:'اختر الفرد المرتبط في «'+esc(x.name)+'»',t:'sel',o:Object.values(x.persons).map(q=>[q.id,q.n]),v:Object.keys(x.persons)[0],h:v=>v.sel!=x.id})),
      [{k:'rel',l:'علاقة الشجرة الجديدة بهذا الفرد',o:[['p','والدان (الخط من الأعلى)'],['s','إخوة (خط عرضي)']],v:'p',h:v=>(tg(v)||{}).ty=='fr'}],
      [{k:'ty',l:'نوع الشجرة الجديدة',o:[['fam','🌳 عائلة'],['fr','🧑‍🤝‍🧑 أصدقاء']],v:'fam',h:v=>v.sel!='new'},
       {k:'tn',l:'اسم الشجرة',t:'text',v:'',h:v=>v.sel!='new'},
       {k:'cat',l:'الفئة (للأصدقاء)',t:'text',v:'أصدقاء',h:v=>v.sel!='new'||v.ty!='fr'}]
    ),v=>{
      const rel=v.rel||'p';
      if(v.sel&&v.sel!='new'){p.links=p.links||[];p.links.push({br:v.sel,bp:v['pp'+v.sel],rel});CH()}
      else{const nt=mk({ty:v.ty,tn:v.tn,cat:v.cat,n:'مضاف'},t.x+40,t.y+(TH[t.id]||200)+70);
        p.links=p.links||[];p.links.push({br:nt.id,bp:Object.keys(nt.persons)[0],rel:'p'});CH()}
    },null,'ربط');
}

/* ============ فكّ الروابط ============ */
function unlinkDlg(targetTree){
  // جد كل (tree, person, linkIndex) التي تشير إلى targetTree
  const items=[];
  boardTrees().forEach(tr=>{
    if(!tr||!tr.persons)return;
    Object.values(tr.persons).forEach(p=>{
      linksOf(p).forEach((l,idx)=>{if(l.br==targetTree.id)items.push({tree:tr,person:p,idx})});
    });
  });
  if(!items.length){dlg('لا روابط',[{k:'m',l:'لا يوجد أفراد مرتبطون بهذه الشجرة.',t:'text',v:''}],()=>{},null,'حسناً');return}
  const html=items.map((it,i)=>`<div class="lnk"><b>${esc(it.person.n)}</b><span style="opacity:.7">من «${esc(it.tree.name)}»</span><button class="unl" data-i="${i}">حذف</button></div>`).join('');
  dlg('🔓 فكّ روابط «'+esc(targetTree.name)+'»',[{k:'h',l:'',t:'html',v:html}],()=>{},null,'إغلاق');
  document.querySelectorAll('#dl .unl').forEach(b=>{
    b.onclick=()=>{
      const it=items[+b.dataset.i];
      it.person.links.splice(it.idx,1);
      CH();
      document.querySelector('#dl .lnk[data-x="'+b.dataset.i+'"]')?.remove();
      // أعد فتح النافذة لتحديث الأرقام
      unlinkDlg(targetTree);
    };
  });
}

/* ============ إدارة زر العين ============ */
function eyeToggle(p){
  linksOf(p).forEach(l=>{const c=boardTrees().find(x=>x.id==l.br);if(c&&c.ty=='fr'){c.hid=c.hid?0:1}});
  CH();
}

/* ============ إضافة / تعديل / حذف فرد ============ */
function delP(t,id){const p=t.persons[id];if(!p)return;
 if(t.ty=='fr'){
   if(p.of){const f=t.persons[p.of];if(f){f.L=(f.L||[]).filter(x=>x!=id);f.R=(f.R||[]).filter(x=>x!=id)}}
   delete t.persons[id];
 }
 else{t.unions.filter(u=>u.p==id).forEach(u=>{if(u.s){t.persons[u.s].j=0;u.p=u.s;u.s=null}else u.p=null});
  t.unions.forEach(u=>{if(u.s==id)u.s=null;u.kids=u.kids.filter(k=>k!=id)});delete t.persons[id];
  t.unions=t.unions.filter(u=>u.p&&t.persons[u.p]);gc(t)}
 CH()}
function emptyT(ty){const k=boardView().k;const t={id:uid(),ty:ty||'fam',name:ty=='fr'?'شجرة أصدقاء':'شجرة عائلة',x:(-boardView().x+innerWidth/2)/k-120,y:(-boardView().y+innerHeight/3)/k-60,hid:0,persons:{},unions:[]};
 if(ty=='fr'){t.cats=[]}
 boardTrees().push(t);CH();return t}
function firstP(t){if(t.ty=='fr'){addFirstFriend(t);return}
 dlg('إضافة أول فرد',pf(B()),v=>{const n={id:uid(),j:0,links:[]};ap(n,v);t.persons[n.id]=n;CH()})}
function dupT(t){const c=JSON.parse(JSON.stringify(t)),m={},mp=i=>m[i]||(m[i]=uid()),np={};c.id=uid();c.name=t.name+' (نسخة)';c.x=t.x+40;c.y=t.y+40;c.hid=0;
 Object.values(c.persons).forEach(p=>{const old=p.id;p.id=mp(p.id);p.links=[];if(p.L)p.L=p.L.map(mp);if(p.R)p.R=p.R.map(mp);if(p.of)p.of=mp(p.of);np[p.id]=p});c.persons=np;
 c.unions.forEach(u=>{u.id=uid();u.p=u.p&&mp(u.p);u.s=u.s&&mp(u.s);u.kids=u.kids.map(mp)});boardTrees().push(c);CH()}
function dupP(t,id){const p=t.persons[id];if(!p)return;const n=Object.assign({},p,{id:uid(),links:[],n:p.n+' (نسخة)'});delete n.st;
 if(t.ty=='fr'){n.of=p.of;n.L=[];n.R=[];if(p.of){const f=t.persons[p.of];if(f){(f.R=f.R||[]).push(n.id)}}}
 else{n.j=0;const u=PU(t,id);if(u)u.kids.splice(u.kids.indexOf(id)+1,0,n.id);else{const h={id:uid(),n:'؟',g:'m',d:0,pr:0,sk:false,j:0,links:[],ph:1};t.persons[h.id]=h;t.unions.push({id:uid(),p:h.id,s:null,side:'R',kids:[id,n.id]})}}
 t.persons[n.id]=n;CH()}

/* ============ التفاعلات ============ */
$('#tr').addEventListener('click',e=>{
  const pe=e.target.closest('.p');const a=e.target.closest('[data-a]');
  const te=e.target.closest('.t[data-t]');
  if(!te)return;const t=boardTrees().find(x=>x.id==te.dataset.t);if(!t)return;
  const id=pe&&pe.dataset.i,p=id&&t.persons[id];
  if(MSON&&pe){MS.has(id)?MS.delete(id):MS.add(id);render();return}
  if(!a){if(pe){sel=id;render()}return}
  const k=a.dataset.a;
  if(k=='mv')return;
  if(k=='first'){firstP(t);return}
  if(k=='firstfr'){addFirstFriend(t);return}
  if(k=='addcat'){addNewCat(t);return}
  if(k=='addcat-friend'){addFriendToCat(t,a.dataset.cat,null);return}
  if(k=='dup'){dupT(t);return}
  if(k=='unlink'){unlinkDlg(t);return}
  if(!p)return;
  if(k=='ai'){aiDlg(t,p);return}
  if(k=='br'){brDlg(t,p);return}
  if(k=='eye'){eyeToggle(p);return}
  if(k=='pr'){snap();p.pr=p.pr%3+1;ch()}
  else if(k=='ed')dlg('تعديل',pf(p),v=>{snap();ap(p,v);ch()},[['حذف الفرد فقط',()=>delP(t,id),'rd']]);
  else if(k=='l'||k=='r'){addFriendToCat(t,p.cat,id)}
  else if(k=='tn')dlg('اسم الشجرة',[{k:'n',l:'الاسم',t:'text',v:t.name}],v=>{snap();t.name=v.n.trim()||t.name;ch()});
  else if(k=='tx')dlg('حذف شجرة «'+esc(t.name)+'»؟',[],()=>{snap();curBoard().trees=boardTrees().filter(x=>x!=t);ch()},null,'نعم، احذف');
});

/* ============ pan/zoom ============ */
const bd=$('#bd'),cv=$('#cv'),tf=()=>cv.style.transform='translate('+boardView().x+'px,'+boardView().y+'px) scale('+boardView().k+')';
bd.addEventListener('pointerdown',e=>{if(e.target.closest('.p,button:not(.mv),.plu,.cat-t'))return;const th=e.target.closest('.th');
 if(th){const t=boardTrees().find(x=>x.id==th.parentNode.dataset.t);if(!t)return;const positions={};positions[t.id]={x:t.x,y:t.y,el:document.querySelector('.t[data-t="'+t.id+'"]')};drag={linked:positions,sx:e.clientX,sy:e.clientY,mode:'tree'}}
 else drag={pan:1,sx:e.clientX,sy:e.clientY,a:boardView().x,b:boardView().y};try{bd.setPointerCapture(e.pointerId)}catch(_){}});
bd.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
 if(drag.pan){const v=boardView();v.x=drag.a+dx;v.y=drag.b+dy;tf()}
 else if(drag.mode=='tree'){const k=boardView().k;Object.keys(drag.linked).forEach(id=>{const o=drag.linked[id],tt=boardTrees().find(x=>x.id==id);if(!tt)return;tt.x=o.x+dx/k;tt.y=o.y+dy/k;if(o.el){o.el.style.left=tt.x+'px';o.el.style.top=tt.y+'px'}});links()}});
const up=()=>{if(drag){if(drag.mode=='tree')snap();drag=null;save()}};bd.addEventListener('pointerup',up);bd.addEventListener('pointercancel',up);
function zoom(f,mx,my){const k0=boardView().k,k=Math.min(2,Math.max(.25,k0*f));const v=boardView();v.x=mx-(mx-v.x)*k/k0;v.y=my-(my-v.y)*k/k0;v.k=k;tf();save()}
bd.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9,e.clientX,e.clientY)},{passive:false});
$('#zi').onclick=()=>zoom(1.2,innerWidth/2,innerHeight/2);$('#zo').onclick=()=>zoom(.83,innerWidth/2,innerHeight/2);
$('#zr').onclick=()=>{const v=boardView();v.x=40;v.y=70;v.k=1;tf();save()};
$('#ms').onclick=()=>{MSON=!MSON;MS.clear();render()};
$('#un').onclick=undo;$('#re').onclick=redo;
$('#mb').onclick=e=>{const m=e.target.dataset.m;if(!m)return;snap();
 if(m=='x'){MSON=false;MS.clear()}
 else if(m=='all')boardTrees().forEach(t=>{if(!t.hid)Object.values(t.persons).forEach(p=>{if(!p.ph&&!p.d)MS.add(p.id)})});
 else if(m=='del'){boardTrees().forEach(t=>{Array.from(MS).forEach(id=>{if(t.persons[id])delP(t,id)})});MS.clear()}
 else{boardTrees().forEach(t=>MS.forEach(id=>{const p=t.persons[id];if(p){if(m=='0')delete p.st;else if(!p.d)p.st=m}}));MS.clear()}
 ch()};
$('#nf').onclick=()=>emptyT('fam');$('#nr').onclick=()=>emptyT('fr');
$('#bk').onclick=()=>dlg('نسخ احتياطي',[{k:'js',l:'انسخ النص للاحتفاظ به:',t:'area',v:JSON.stringify(S)}],v=>{try{const n=JSON.parse(v.js);snap();
  if(Array.isArray(n.boards))S=n;
  else if(Array.isArray(n.trees)){n.trees.forEach(migrateTree);const b={id:uid(),name:'مستورد',trees:n.trees,v:n.v||{x:40,y:70,k:1},savedAt:Date.now()};S.boards.push(b);S.current=b.id}
  else throw 0;
  tf();ch()}catch(x){dlg('نص غير صالح',[],()=>{},null,'حسناً')}},null,'استيراد');

/* ============ إدارة المناسبات ============ */
function renderWbName(){const el=$('#wbName');const b=curBoard();el.textContent=b&&b.name?b.name:'(بدون اسم)'}
function renderWbList(){const box=$('#wbList');box.innerHTML=S.boards.map(b=>'<button data-bid="'+b.id+'" class="'+(b.id==S.current?'cur':'')+'">'+esc(b.name||'(بدون اسم)')+'</button>').join('')}
function switchTo(bid){if(bid==S.current)return;
  $('#dl').innerHTML='<h3>الانتقال إلى مناسبة أخرى</h3><p style="margin:6px 0;font-size:13px;line-height:1.6">هل تريد حفظ المناسبة الحالية «<b>'+esc(curBoard().name||'(بدون اسم)')+'</b>» قبل الانتقال؟</p><div class="bt"><button id="ok">حفظ وخروج (انتقال)</button><button id="cx">إلغاء</button></div>';
  $('#ov').style.display='flex';
  $('#ok').onclick=()=>{$('#ov').style.display='none';save();S.current=bid;save();MS.clear();sel=null;tf();render()};
  $('#cx').onclick=()=>{$('#ov').style.display='none'};
}
$('#wbList').onclick=e=>{const b=e.target.closest('button[data-bid]');if(!b)return;if(b.dataset.bid==S.current)return;switchTo(b.dataset.bid)};
$('#wbName').onclick=()=>{const b=curBoard();dlg('اسم المناسبة',[{k:'n',l:'الاسم',t:'text',v:b.name||''}],v=>{snap();b.name=(v.n||'').trim()||b.name||'بدون اسم';save();renderWbName();renderWbList()})};
$('#wbNew').onclick=()=>{dlg('مناسبة جديدة',[{k:'n',l:'اسم المناسبة',t:'text',v:'مناسبة '+(S.boards.length+1)}],v=>{const nm=(v.n||'').trim()||('مناسبة '+(S.boards.length+1));
  save();const nb={id:uid(),name:nm,trees:[],v:{x:40,y:70,k:1},savedAt:Date.now()};S.boards.push(nb);S.current=nb.id;save();MS.clear();sel=null;tf();render();emptyT('fam')})};
$('#wbDup').onclick=()=>{const src=curBoard();const base=(src.name||'مناسبة').replace(/\s*\(\d+\)\s*$/,'');let n=1;while(S.boards.some(b=>b.name==(base+' ('+n+')')))n++;
  save();const copy=JSON.parse(JSON.stringify(src));copy.id=uid();copy.name=base+' ('+n+')';copy.savedAt=Date.now();
  S.boards.push(copy);S.current=copy.id;save();MS.clear();sel=null;tf();render();const ts=$('#ts');ts.textContent='✔ تم إنشاء نسخة: '+copy.name;ts.style.display='block';setTimeout(()=>ts.style.display='none',1800)};
$('#wbSave').onclick=()=>{const b=curBoard();b.savedAt=Date.now();save();const ts=$('#ts');ts.textContent='✔ تم حفظ «'+(b.name||'')+'»';ts.style.display='block';setTimeout(()=>ts.style.display='none',1500)};
$('#wbDel').onclick=()=>{const b=curBoard();if(S.boards.length<=1){dlg('لا يمكن الحذف',[{k:'m',l:'يجب أن تبقى مناسبة واحدة على الأقل.',t:'text',v:''}],()=>{},null,'حسناً');return}
  dlg('حذف «'+esc(b.name||'')+'»؟',[],()=>{snap();S.boards=S.boards.filter(x=>x.id!=b.id);S.current=S.boards[0].id;save();MS.clear();sel=null;tf();render()},null,'نعم، احذف')};
$('#wbLink').onclick=async()=>{
 try{
  const b=curBoard();
  const json=JSON.stringify({boards:S.boards,current:S.current});
  let b64;
  if(typeof CompressionStream!=='undefined'){
   const cs=new CompressionStream('gzip');
   const stream=new Blob([json]).stream().pipeThrough(cs);
   const buf=await new Response(stream).arrayBuffer();
   b64=btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
   b64='gz:'+b64;
  }else{b64='raw:'+btoa(unescape(encodeURIComponent(json)))}
  const url=location.origin+location.pathname+'#wb='+encodeURIComponent(b64);
  try{await navigator.clipboard.writeText(url)}catch(e){}
  const ts=$('#ts');ts.textContent='✔ تم نسخ ('+ (b.name||'') +')';ts.style.display='block';setTimeout(()=>ts.style.display='none',2000);
 }catch(e){dlg('تعذّر إنشاء الرابط',[{k:'m',l:'الخطأ: '+(e.message||e),t:'text',v:''}],()=>{},null,'حسناً')}
};
(async()=>{
 const h=location.hash;
 if(h&&h.indexOf('#wb=')==0){
  try{
   let b64=decodeURIComponent(h.slice(4));
   let json;
   if(b64.indexOf('gz:')==0){b64=b64.slice(3);
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bin]).stream().pipeThrough(ds);
    json=await new Response(stream).text();
   }else{b64=b64.slice(4);json=decodeURIComponent(escape(atob(b64)))}
   const n=JSON.parse(json);
   if(Array.isArray(n.boards)){snap();S=n;tf();ch();const ts=$('#ts');ts.textContent='✔ تم التحميل من الرابط';ts.style.display='block';setTimeout(()=>ts.style.display='none',2500);history.replaceState(null,'',location.pathname)}
  }catch(e){console.warn('رابط غير صالح',e)}
 }
})();

function boot(){
  const b=curBoard();
  if(!b)return;
  if(!b.name){
    setTimeout(()=>{
      $('#dl').innerHTML='<h3>مرحباً! ما اسم هذه المناسبة؟</h3><label>اسم المناسبة (عرس فلان، خطبة فلانة…)</label><input type="text" id="bn" value=""><div class="bt"><button id="ok">ابدأ</button></div>';
      $('#ov').style.display='flex';
      $('#ok').onclick=()=>{const nm=($('#bn').value||'').trim()||'لوحتي';b.name=nm;save();$('#ov').style.display='none';renderWbName();renderWbList()};
      const inp=$('#bn');if(inp)setTimeout(()=>inp.focus(),100);
    },50);
  }
}

try{tf();render();boot()}catch(err){console.error(err);const ts=$('#ts');if(ts){ts.textContent='⚠ خطأ: '+(err.message||err);ts.style.display='block'}}
</script></body></html>
