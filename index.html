<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>عدّاد المعازيم</title>
<link href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdf6;--ink:#2b2b2b;--dot:#ddd8c8;--card:#fff;--ln:#444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#23221f;--ink:#eee;--dot:#3a3935;--card:#2e2d29;--ln:#ccc}}
:root[data-theme="dark"]{--bg:#23221f;--ink:#eee;--dot:#3a3935;--card:#2e2d29;--ln:#ccc}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{position:relative;background:var(--bg);color:var(--ink);font-family:'Marhey','Segoe UI',Tahoma,sans-serif;overflow:hidden}
#bd{position:absolute;inset:0;direction:ltr;touch-action:none;cursor:grab;background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:26px 26px}
#cv{position:absolute;left:0;top:0;transform-origin:0 0;color:var(--ln)}
.t{position:absolute;border:2px dashed var(--ln);border-radius:16px 8px 18px 9px/9px 17px 8px 16px}
.th{position:relative;z-index:2;height:34px;display:flex;align-items:center;gap:4px;padding:0 10px;cursor:move;font-weight:600;direction:rtl;user-select:none}.th span{flex:1}
button{font:inherit;cursor:pointer;color:inherit}
.th button,.p button{background:none;border:0;padding:0 2px;font-size:13px}
.p{position:absolute;width:130px;height:56px;background:#fff;color:#222;border:3px solid;border-radius:12px 6px 14px 7px/7px 13px 6px 12px;padding:6px 10px 6px 24px;font-size:14px;display:flex;align-items:center;cursor:pointer}
.p b{font-weight:600;line-height:1.2;direction:rtl;text-align:right;width:100%;overflow:hidden;max-height:42px}
.p small{position:absolute;right:4px;bottom:1px;font-size:10px}
.m{border-color:#9cc3ee}.f{border-color:#f2a9c9}
.phb{opacity:.55;border:2px dashed #999;background:transparent;font-size:12px;justify-content:center;cursor:default;padding:4px}
.dead{background:#e2e2e2;color:#888;border-style:dashed}.dead b{opacity:.7}
.pr{position:absolute;left:5px;top:5px;width:13px;height:13px;border-radius:50%;border:2px dashed #aaa}
.pr1{background:#e5484d;border:2px solid #e5484d}.pr2{background:#f5c518;border:2px solid #f5c518}.pr3{background:#3cb371;border:2px solid #3cb371}
.p button{position:absolute;bottom:1px;left:3px}.p button+button{left:22px;opacity:.45}.p button.on{opacity:1}.p button+button+button{left:40px}
.big{position:absolute;left:50%;top:calc(50% + 17px);transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;border:3px dashed var(--ln);background:var(--card);font-size:40px;color:var(--ink)}
.tb.on{background:#ffd95a;color:#222}.ms .p button,.ms .pl{display:none!important}.p.ms1{outline:3px solid #ffb300;outline-offset:2px}.no{opacity:.5}.no b{text-decoration:line-through}
.bg{position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;font-style:normal;text-align:center;line-height:20px;font-size:12px;color:#fff;z-index:3}.bg.y{background:#3cb371}.bg.n{background:#e5484d}
#cnt .stl{direction:rtl;text-align:right;font-size:12px}
#mb{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--card);border:2px solid var(--ln);border-radius:12px;padding:6px 10px;z-index:40;max-width:94vw}
#ts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:2px solid var(--ln);border-radius:10px;padding:6px 14px;display:none;z-index:60}
.pl{position:absolute;width:20px;height:20px;line-height:16px;text-align:center;background:#fff;color:#222;border:2px solid #555;border-radius:50%;font-size:15px;display:none;z-index:5;text-decoration:none}
.p:hover .pl,.p.sel .pl{display:block}.p:hover,.p.sel{z-index:9}
.pl.pt{top:-22px;left:52px}.pl.b{bottom:-22px;left:52px}.pl.l{left:-22px;top:15px}.pl.r{right:-22px;top:15px}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}#top h1{margin:0 0 0 auto;font-size:22px;order:-1}
.tb{background:var(--card);border:2px solid var(--ln);border-radius:10px 5px 11px 6px;padding:3px 10px}
#cnt{position:fixed;left:8px;top:calc(54px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;direction:ltr;background:var(--card);border:2px solid var(--ln);border-radius:12px 6px 14px 7px;padding:8px;font-size:13px;width:130px;pointer-events:none}
#cnt .cr{display:flex;align-items:flex-start;justify-content:flex-end;gap:5px;border-bottom:1px dashed var(--ln);padding-bottom:8px}
#cnt .tx{display:flex;flex-direction:column;align-items:flex-end;gap:3px;direction:rtl;line-height:1.3}#cnt .tot{border:2px solid var(--ln);border-radius:8px 4px 9px 5px;padding:1px 8px}#cnt .bl{color:#4a90d9}#cnt .pk{color:#e0568f}
#cnt em{display:flex;flex-direction:column;gap:4px;margin-top:3px}#cnt em i{width:14px;height:14px;border-radius:50%;display:block}
#ov{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:50}
#dl{background:var(--card);color:var(--ink);border:2px solid var(--ln);border-radius:14px 7px 16px 8px;padding:14px;width:min(380px,92vw);max-height:90vh;overflow:auto}
#dl h3{margin:0 0 6px}#dl label{display:block;margin:8px 0 3px;font-size:13px}
#dl input[type=text],#dl select,#dl textarea{width:100%;font:inherit;padding:6px;background:var(--bg);color:var(--ink);border:2px solid var(--ln);border-radius:8px}#dl textarea{height:170px}
.ch{display:flex;gap:5px;flex-wrap:wrap}.ch button,.bt button{background:var(--bg);border:2px solid var(--ln);border-radius:8px;padding:3px 10px}.ch .on,#ok{background:#ffd95a!important;color:#222}
.bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.rd{color:#c33}
.pc{position:absolute;right:4px;top:1px;font-size:9px;opacity:.7;background:#fff;color:#222;padding:0 3px;border-radius:4px}
/* عدّاد منتصف الشجرة العلوي مع hover */
.tcnt{position:absolute;left:50%;top:4px;transform:translateX(-50%);background:var(--card);border:2px solid var(--ln);border-radius:8px 4px 9px 5px;padding:3px 14px;font-size:12px;font-weight:600;direction:rtl;z-index:5;cursor:help}
.tcnt .pop{display:none;position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;background:var(--card);border:2px solid var(--ln);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:400;line-height:1.7;min-width:180px;text-align:right;white-space:nowrap;box-shadow:0 2px 10px #0003;z-index:10}
.tcnt:hover .pop{display:block}
.tcnt .pop b{font-weight:600}
.tcnt .m{color:#4a90d9}.tcnt .f{color:#e0568f}.tcnt .dl{color:#888}
/* لوحة الحفظ أسفل العدّاد الأيسر */
#wb{position:fixed;left:8px;top:calc(290px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;background:var(--card);border:2px solid var(--ln);border-radius:10px;padding:6px;font-size:12px;width:130px;z-index:20}
#wb button{width:100%;background:var(--bg);border:2px solid var(--ln);border-radius:6px;padding:4px 6px;font-size:12px;text-align:center}
#wb button:hover{background:#ffd95a;color:#222}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="wb"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>
<div id="bd"><div id="cv"><svg id="lk" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" fill="none" stroke="currentColor" stroke-width="2"></svg><div id="tr"></div></div></div>
<div id="top"><h1>✏️ عدّاد المعازيم</h1><button class="tb" id="nf">🌳 شجرة عائلة</button><button class="tb" id="nr">🧑‍🤝‍🧑 شجرة أصدقاء</button><button class="tb" id="bk">💾 نسخ احتياطي</button><button class="tb" id="ms">☑ تحديد</button><button class="tb" id="un">↶ تراجع</button><button class="tb" id="re">↷ إعادة</button><button class="tb" id="zi">＋</button><button class="tb" id="zo">－</button><button class="tb" id="zr">⌂</button></div>
<div id="cnt"></div><div id="ts"></div><div id="mb"></div>
<div id="wb">
 <button id="wbsave">💾 حفظ اللوحة</button>
 <button id="wbload">📂 استرداد اللوحة</button>
 <button id="wblink">🔗 نسخ رابط مشترك</button>
</div>
<div id="ov"><div id="dl"></div></div>
<script>
const $=s=>document.querySelector(s),W=130,H=56,G=26,V=86;
let MSON=false,S=null,TW={},KO={},POS={},OX={},TH={},memo,sel=null,drag=null;
let UNDO=[],REDO=[],UNDO_LOCK=false;
try{S=JSON.parse(localStorage.getItem('mz')||'null')}catch(e){}
if(!S||!S.trees)S={trees:[],v:{x:40,y:70,k:1}};
const save=()=>{try{localStorage.setItem('mz',JSON.stringify(S))}catch(e){}};
function snap(){if(UNDO_LOCK)return;UNDO.push(JSON.stringify(S));if(UNDO.length>60)UNDO.shift();REDO=[]}
function undo(){if(!UNDO.length)return;REDO.push(JSON.stringify(S));const p=UNDO.pop();UNDO_LOCK=true;S=JSON.parse(p);try{localStorage.setItem('mz',p)}catch(e){}tf();render();UNDO_LOCK=false}
function redo(){if(!REDO.length)return;UNDO.push(JSON.stringify(S));const p=REDO.pop();UNDO_LOCK=true;S=JSON.parse(p);try{localStorage.setItem('mz',p)}catch(e){}tf();render();UNDO_LOCK=false}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PU=(t,id)=>t.unions.find(u=>u.kids.includes(id));
const root=t=>{let x=Object.keys(t.persons)[0];for(let i=0;i<99;i++){const j=t.unions.find(u=>u.s==x),q=PU(t,x);if(j)x=j.p;else if(q)x=q.p;else break}return x};
const tp=(t,x)=>{for(let i=0;i<99;i++){const q=PU(t,x);if(!q)break;x=q.p}return x};
const MS=new Set();
const gc=t=>{if(t.ty=='fr')return;t.unions=t.unions.filter(u=>{const p=t.persons[u.p];if(p&&p.ph&&!u.kids.length){delete t.persons[u.p];return false}return true})};
const ch=()=>{S.trees.forEach(gc);save();render()};
const CH=()=>{snap();ch()};
const cl=(A,B)=>A.some(a=>B.some(b=>a.r==b.r&&Math.abs(a.x-b.x)<W+10));
const sh=(A,x,r)=>A.map(a=>({i:a.i,x:a.x+x,r:a.r+r}));
function anc(t,sid,sd){const Q=PU(t,sid);if(!Q)return[];KO[Q.id]={s:sid,d:sd};
 const b=lay(t,tp(t,Q.p)),g=b.it.find(a=>a.i==sid);return g?sh(b.it.filter(a=>a.i!=sid),-g.x,-g.r):[]}
function lay(t,id){if(memo[id])return memo[id];const B=memo[id]={it:[{i:id,x:0,r:0}]};
 const us=t.unions.filter(u=>u.p==id),sp=us.filter(u=>u.s);let it,d=W+G;
 for(;d<W+G+1400;d+=20){it=[{i:id,x:0,r:0}];sp.forEach(u=>{const x=u.side=='L'?-d:d;it.push({i:u.s,x,r:0},...sh(anc(t,u.s,u.side),x,0))});
  if(!it.some((a,i)=>it.some((b,j)=>j>i&&a.r==b.r&&Math.abs(a.x-b.x)<W+10)))break}
 const w=k=>{const q=t.unions.filter(x=>x.p==k&&x.s&&PU(t,x.s));return q.some(x=>x.side=='L')?-1:q.some(x=>x.side=='R')?1:0};
 [...sp,...us.filter(u=>!u.s)].forEach(u=>{let ks=u.kids.slice().sort((a,b)=>w(a)-w(b));const e=KO[u.id];if(e){ks=ks.filter(k=>k!=e.s);e.d=='R'?ks.unshift(e.s):ks.push(e.s)}
  if(!ks.length)return;let acc=[],xs=[];
  ks.forEach(k=>{const b=sh(lay(t,k).it,0,1);let x=0;if(acc.length){x=-1e9;acc.forEach(a=>b.forEach(c=>{if(a.r==c.r)x=Math.max(x,a.x-c.x+W+G)}))}xs.push(x);acc=acc.concat(sh(b,x,0))});
  const cm=u.s?(u.side=='L'?-d/2:d/2):0,mid=(xs[0]+xs[xs.length-1])/2;let ok=0;
  for(let k=0;k<400&&!ok;k++){const z=sh(acc,cm-mid+(k%2?-1:1)*Math.ceil(k/2)*10,0);if(!cl(z,it)){it=it.concat(z);ok=1}}
  if(!ok)it=it.concat(sh(acc,cm-mid+4000,0))});
 B.it=it;return B}
const hsd=(t,id,s)=>t.unions.some(u=>u.p==id&&u.s&&u.side==s);
function ph(t,id,x,y,pl){const p=t.persons[id];if(p.ph)return'';const cat=p.cat&&p.cat!='none'?`<i class="pc">${({work:'💼',study:'🎓',hood:'🏘️'})[p.cat]||''}</i>`:'';return`<div class="p ${p.g} ${p.d?'dead':''} ${sel==id?'sel':''} ${MS.has(id)?'ms1':''} ${p.st=='n'?'no':''}" data-i="${id}" style="left:${x-W/2}px;top:${y}px">${p.d?'':`<i class="pr pr${p.pr}" data-a="pr" title="الأولوية"></i>`}${p.st?`<em class="bg ${p.st}">${p.st=='y'?'✔':'✖'}</em>`:''}${cat}<b>${esc(p.n)}</b>${p.sk?'<small>مذكور ↩</small>':''}<button data-a="ed">✎</button>${p.of?'':`<button data-a="br" class="${p.br?'on':''}" title="حلقة">${(c=>c&&c.ty=='fr'&&c.hid?'👁':'🌿')(p.br&&S.trees.find(x=>x.id==p.br))}</button>`}<button data-a="ai" title="إضافة أفراد بالكتابة">✨</button>${[...pl].map(k=>`<u class="pl ${k=='t'?'pt':k}" data-a="${k}">+</u>`).join('')}</div>`}
// عدّاد منتصف الشجرة العلوي مع hover
function tcnt(t){let m=0,f=0,dm=0,df=0,noM=0,noF=0;
 Object.values(t.persons).forEach(p=>{if(p.ph)return;if(p.d){p.g=='f'?df++:dm++;return}
  p.g=='f'?f++:m++; // العدد الكلي بدون المتوفى
  if(p.st=='n'){p.g=='f'?noF++:noM++}});
 const mAlive=m-noM,fAlive=f-noF;
 return`<div class="tcnt">عداد<span class="pop"><b>العدد الكلي</b><br><span class="m">ذكور: ${m}</span> · <span class="f">إناث: ${f}</span><br><b>بعد خصم الاعتذار</b><br><span class="m">ذكور: ${mAlive}</span> · <span class="f">إناث: ${fAlive}</span><br><span class="dl">معتذر: ${noM+noF}</span>${dm+df?`<br><span class="dl">متوفى: ${dm+df}</span>`:''}</span></div>`}
function render(){memo={};KO={};POS={};let h='';
 S.trees.forEach(t=>{if(t.hid&&t.ty!='fr')t.hid=0;if(t.hid)return;const fr=t.ty=='fr',pos={};let w,ox,m,my=0,d='',ps='';const em=!Object.keys(t.persons).length;
  if(em){w=230;ox=20;ps='<button class="big" data-a="first">＋</button>'}else if(fr){const L=Math.max(0,...t.order.map(i=>t.persons[i].L.length)),R=Math.max(0,...t.order.map(i=>t.persons[i].R.length));
   t.order.forEach((f,i)=>{const p=t.persons[f],y=i*(H+34);pos[f]={x:0,y};p.L.forEach((r,j)=>pos[r]={x:-(j+1)*(W+G),y});p.R.forEach((r,j)=>pos[r]={x:(j+1)*(W+G),y})});
   ox=20+W/2+L*(W+G);w=Math.max(ox+W/2+R*(W+G)+20,230)}
  else{const b=lay(t,root(t)),r0=Math.min(...b.it.map(a=>a.r)),x0=Math.min(...b.it.map(a=>a.x)),x1=Math.max(...b.it.map(a=>a.x));b.it.forEach(a=>pos[a.i]={x:a.x,y:(a.r-r0)*(H+V)});w=Math.max(x1-x0+W+40,230);ox=20+W/2-x0}
  OX[t.id]=ox;POS[t.id]=pos;const X=i=>pos[i].x+ox,Y=i=>pos[i].y+58;
  if(fr)t.order.forEach(f=>{const p=t.persons[f],y=Y(f)+H/2;[p.L,p.R].forEach(a=>{let pv=f;a.forEach(r=>{const x1=X(pv),x2=X(r);d+=`M${Math.min(x1,x2)+W/2} ${y}H${Math.max(x1,x2)-W/2}`;pv=r})})});
  else t.unions.forEach(u=>{if(!pos[u.p])return;const y=Y(u.p);let mx=X(u.p),y0=y+H;
   if(u.s&&pos[u.s]){const a=X(u.p),b=X(u.s);d+=`M${Math.min(a,b)+W/2} ${y+H/2}H${Math.max(a,b)-W/2}`;mx=(a+b)/2;y0=y+H/2}
   const kk=u.kids.filter(k=>pos[k]);if(kk.length){const bus=y+H+V/2,xs=kk.map(X);const pp0=t.persons[u.p]||{};if(pp0.ph&&!pp0.br)y0=bus;d+=`M${mx} ${y0}V${bus}M${Math.min(mx,...xs)} ${bus}H${Math.max(mx,...xs)}`;kk.forEach(k=>d+=`M${X(k)} ${bus}V${Y(k)}`)}});
  Object.keys(pos).forEach(id=>{const p=t.persons[id];if(!p)return;my=Math.max(my,pos[id].y);
   ps+=ph(t,id,X(id),Y(id),fr?(p.of?'':'blr'):'tb'+(p.j||hsd(t,id,'L')?'':'l')+(p.j||hsd(t,id,'R')?'':'r'))});
  // مساحة إضافية أعلى الشجرة للعدّاد
  const padTop=42,hh=(em?190:my+H+58+26)+padTop;
  // إزاحة الرسم لأسفل بـ padTop
  ps=ps.replace(/top:(\d+(\.\d+)?)px/g,(_,v)=>`top:${+v+padTop}px`);
  d=''; // إعادة رسم الخطوط بإزاحة
  if(fr)t.order.forEach(f=>{const p=t.persons[f],y=Y(f)+H/2+padTop;[p.L,p.R].forEach(a=>{let pv=f;a.forEach(r=>{const x1=X(pv),x2=X(r);d+=`M${Math.min(x1,x2)+W/2} ${y}H${Math.max(x1,x2)-W/2}`;pv=r})})});
  else t.unions.forEach(u=>{if(!pos[u.p])return;const y=Y(u.p)+padTop;let mx=X(u.p),y0=y+H;
   if(u.s&&pos[u.s]){const a=X(u.p),b=X(u.s);d+=`M${Math.min(a,b)+W/2} ${y+H/2}H${Math.max(a,b)-W/2}`;mx=(a+b)/2;y0=y+H/2}
   const kk=u.kids.filter(k=>pos[k]);if(kk.length){const bus=y+H+V/2,xs=kk.map(X);const pp0=t.persons[u.p]||{};if(pp0.ph&&!pp0.br)y0=bus;d+=`M${mx} ${y0}V${bus}M${Math.min(mx,...xs)} ${bus}H${Math.max(mx,...xs)}`;kk.forEach(k=>d+=`M${X(k)} ${bus}V${Y(k)+padTop}`)}});
  TH[t.id]=hh;TW[t.id]=w;const lk=S.trees.some(x=>Object.values(x.persons).some(p=>p.br==t.id));
  h+=`<div class="t" data-t="${t.id}" style="left:${t.x}px;top:${t.y}px;width:${w}px;height:${hh}px"><div class="th"><button class="mv" data-a="mv" title="تحريك الشجرة">✥</button><span>${fr?'🧑‍🤝‍🧑':'🌳'} ${esc(t.name)}</span><button data-a="tn" title="تعديل الاسم">✎</button>${lk&&fr?'<button data-a="hd" title="إخفاء">👁</button>':''}<button data-a="dup" title="نسخ الشجرة">⧉</button><button data-a="tx" title="حذف الشجرة">🗑</button></div><svg width="${w}" height="${hh}" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none;filter:url(#wb)" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="${d}"/></svg>${ps}${em?'':tcnt(t)}</div>`});
 $('#tr').innerHTML=h;links();cnt();msUi()}

  let b64;

   const cs=new CompressionStream('gzip');

   const buf=await new Response(stream).arrayBuffer();

  }else{b64='raw:'+btoa(unescape(encodeURIComponent(json)))}
